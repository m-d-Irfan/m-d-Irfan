name: Generate Contribution Grid

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake & Grid
        uses: Platane/snk@v3
        with:
          github_user_name: m-d-Irfan
          outputs: |
            dist/github-contribution-grid-dark.svg?palette=github-dark&color_snake=transparent

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
